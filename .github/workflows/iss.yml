name: ISS observer

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:          # lets you start one by hand from the Actions tab

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python main.py
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
          MY_LAT: ${{ secrets.MY_LAT }}
          MY_LONG: ${{ secrets.MY_LONG }}
          RUN_SECONDS: "21000"
          POLL_SECONDS: "60"
